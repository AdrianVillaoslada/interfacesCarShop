<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact form | Car Shop</title>
    <link rel="stylesheet" href="scss/miestilo.css">
</head>
<body class="assistance-page">
    <header class="d-flex justify-content-end align-items-center">
        <nav class="d-flex align-items-center" aria-label="Main navigation">
            <p>Products</p>
            <p>Solutions</p>
            <p>Contact</p>
            <button class="btn btn-outline-secondary btn-sm" type="button">Sign in</button>
            <button class="btn btn-dark btn-sm" type="button">Register</button>
        </nav>
    </header>

    <main class="d-flex justify-content-center align-items-center">
        <form action="#" method="post">
            <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input class="form-control" id="name" name="name" type="text" placeholder="Value">
            </div>

            <div class="mb-3">
                <label class="form-label" for="surname">Surname</label>
                <input class="form-control" id="surname" name="surname" type="text" placeholder="Value">
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" placeholder="Value">
            </div>

            <div class="mb-3">
                <label class="form-label" for="message">Message</label>
                <textarea class="form-control" id="message" name="message" rows="3" placeholder="Value"></textarea>
            </div>

            <button class="btn btn-dark w-100" type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
